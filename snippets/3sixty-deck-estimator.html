<script>
/* ============================================================================
   2. PRICING CORE - pure functions, no DOM. Safe to unit test or lift out.
   ============================================================================ */

var Pricing = (function(){

  /* Footing count (concrete footings since 2026-10-05, see CONFIG.footings).
     The previous build used two rounding regimes and a floor applied in the
     wrong order, which made a 199 sqft deck need 4 screws while a 200 sqft
     deck needed 3 - the larger deck came out cheaper. One ceiling plus one
     floor is monotonic and matches the old numbers everywhere above 200. */
  function footings(sqft){
    var f = CONFIG.footings;
    return Math.max(f.minimum, Math.ceil(f.base + f.perSqft * sqft));
  }

  /* Suggested railing run. Assumes the deck attaches to the house along its
     LONGER side and railing wraps the other three - perimeter minus the
     longer side, i.e. length + width + the shorter of the two again. This
     is exactly the formula that produces 48lf for the original 20x14
     default, so an untouched deck's price does not move. It is a suggestion
     like the footing count, not a real measurement - an L-shaped deck, one
     attached on its short side, or a deck with no house wall at all will
     need the override. */
  function suggestedRailLf(length, width){
    return Math.max(0, length + width + Math.min(length, width));
  }

  function tierAt(index){
    return CONFIG.tiers[index] || CONFIG.tiers[0];
  }

  function railFor(key){
    for(var i=0;i<CONFIG.rails.length;i++){
      if(CONFIG.rails[i].key === key) return CONFIG.rails[i];
    }
    if(window.console) console.warn("Unknown rail key: " + key + " - falling back to " + CONFIG.rails[0].key);
    return CONFIG.rails[0];
  }

  /* Priced line items for one level. Returns real numbers only; TBD add-ons
     are listed separately so they can never quietly enter a subtotal. */
  /* An override box holds exactly what was typed (a string, possibly empty) so
     the field can be cleared and retyped. ovr() is the number that prices: the
     typed value when it is a usable number (0 only where allowZero), otherwise
     the suggestion. shown() is what the box displays: the typed text, or the
     suggestion until the first edit. */
  function ovr(v, fallback, allowZero){
    if(v === null || v === undefined) return fallback;
    var n = parseFloat(v);
    if(!isFinite(n)) return fallback;
    return (n > 0 || (allowZero && n === 0)) ? n : fallback;
  }
  function shown(v, fallback){ return (v === null || v === undefined) ? fallback : v; }

  function level(d){
    var p     = CONFIG.pricing;
    var sqft  = d.length * d.width;
    var tier  = tierAt(d.tier);
    var screws = ovr(d.footingOverride, footings(sqft), true);   /* 0 is a real choice: existing footings reused */
    /* Same override pattern as screws: the field shows a suggestion, the
       actual state field only holds a REAL value once the customer (or a
       length/width edit) changes it. Effective value falls back to the
       suggestion so pricing is always driven by one of the two. */
    var railLf = ovr(d.railLfOverride, suggestedRailLf(d.length, d.width));
    var stepCount = ovr(d.stepOverride, p.standardSteps);
    var items = [];

    /* kind is the stable key a QuickBooks item gets mapped from. label
       changes with the material; kind never does. qty x rate == amount for
       every line except a demo charge that hit its minimum (see below). */
    items.push({
      kind:   "decking", qty: sqft, unit: "sqft", rate: tier.psf,
      label:  tier.mfr + " " + tier.name,
      detail: sqft + " sqft x $" + tier.psf,
      amount: sqft * tier.psf
    });

    /* No footings line at all when the count is 0, so the estimate (and the
       QuickBooks lines built from it) never carries a $0 footings row. */
    if(screws > 0){
      items.push({
        kind:   "footings", qty: screws, unit: "ea", rate: p.footingEach,
        label:  "Concrete footings",
        detail: screws + " x $" + p.footingEach,
        amount: screws * p.footingEach
      });
    }

    if(d.hasRail){
      var rail = railFor(d.railType);
      items.push({
        kind:   "railing", qty: railLf, unit: "lf", rate: rail.price,
        label:  rail.name + " railing",
        detail: railLf + " lf x $" + rail.price,
        amount: railLf * rail.price
      });
    }

    if(d.hasSteps){
      var stairW   = ovr(d.stairWidth, p.stairBaseWidth);
      var perStair = tier.stair + Math.max(0, stairW - p.stairBaseWidth) * tier.stairLf;
      items.push({
        kind:   "steps", qty: stepCount, unit: "ea", rate: perStair,
        label:  "Stairs, " + stairW + " ft wide",
        detail: stepCount + " x $" + perStair,
        amount: stepCount * perStair
      });
    }

    if(d.hasWaterproof){
      var wpSqft = d.waterproofSqft > 0 ? d.waterproofSqft : sqft;
      items.push({
        kind:   "waterproofing", qty: wpSqft, unit: "sqft", rate: p.waterproofPsf,
        label:  "Waterproofing (RainEscape)",
        detail: wpSqft + " sqft x $" + p.waterproofPsf,
        amount: wpSqft * p.waterproofPsf
      });
    }

    if(d.hasDemo){
      var dSqft = d.demoSqft > 0 ? d.demoSqft : sqft;
      items.push({
        kind:   "demo", qty: dSqft, unit: "sqft", rate: p.demoPsf,
        label:  "Remove existing deck",
        detail: dSqft + " sqft x $" + p.demoPsf,
        amount: dSqft * p.demoPsf
      });
    }

    /* Priced add-ons are lines; the rest, and the cocktail rail, are listed
       as quoted on site so they can never quietly enter a subtotal. */
    var tbd = [];
    if(d.hasRail && d.cocktailRail) tbd.push("Cocktail rail");
    for(var i=0;i<CONFIG.addons.length;i++){
      var a = CONFIG.addons[i];
      if(!d.addons[a.key]) continue;
      if(!a.rate){ tbd.push(a.label); continue; }
      var aq = a.per === "sqft" ? sqft : addonQty(d, a);
      items.push({
        kind:   "addon", qty: aq, unit: a.per, rate: a.rate,
        label:  a.label,
        detail: aq + " " + a.per + " x $" + a.rate,
        amount: aq * a.rate
      });
    }

    var subtotal = 0;
    for(var j=0;j<items.length;j++) subtotal += items[j].amount;

    return { sqft:sqft, tier:tier, screws:screws, railLf:railLf, stepCount:stepCount, items:items, tbd:tbd, subtotal:subtotal };
  }

  /* Whole-project total.
     subtotal + adjustment == high, exactly, so the printed table adds up. */
  /* A per-foot add-on's length: what was typed, else the deck's longer side. */
  function addonLf(d){ return Math.max(d.length, d.width); }
  function addonQty(d, a){
    var typed = d.addonQty && d.addonQty[a.key];
    return typed > 0 ? typed : addonLf(d);
  }

  function total(levels, custom, promos){
    var results = [], subtotal = 0, sqft = 0, anyTbd = false;

    for(var i=0;i<levels.length;i++){
      var r = level(levels[i]);
      results.push(r);
      subtotal += r.subtotal;
      sqft     += r.sqft;
      if(r.tbd.length) anyTbd = true;
    }

    /* Custom line items: a rep's own name and figure (portal copy only). Kept
       out of the adjustment and added exactly as entered; a negative one is a
       discount. A row with no amount is ignored. */
    var extras = [], extraSum = 0;
    for(var c=0;c<(custom || []).length;c++){
      var amt = parseFloat(custom[c] && custom[c].amount);
      if(!isFinite(amt) || amt === 0) continue;
      amt = Math.round(amt * 100) / 100;
      var nm = String((custom[c].name || "")).replace(/\s+/g, " ").trim().slice(0, 80);
      extras.push({ kind:"custom", qty:1, unit:"ea", rate:amt, label: nm || "Custom item", detail:"", amount:amt });
      extraSum += amt;
    }

    var adjusted   = Math.round(subtotal * CONFIG.pricing.adjustment);
    var adjustment = adjusted - Math.round(subtotal);
    /* Promotions: a rep's named discount, in dollars or a percent of the
       total before any promotion. Never takes the estimate below $1. */
    var preDiscount = Math.round((adjusted + extraSum) * 100) / 100;
    var discounts = [], discountSum = 0;
    for(var q=0;q<(promos || []).length;q++){
      var pr = promos[q] || {};
      var pv = parseFloat(pr.value);
      if(!isFinite(pv) || pv <= 0) continue;
      var isPct = pr.type === "percent";
      var damt = isPct ? Math.round(preDiscount * Math.min(pv, 100)) / 100 : Math.round(pv * 100) / 100;
      damt = Math.min(damt, Math.max(0, Math.round((preDiscount - discountSum - 1) * 100) / 100));
      if(damt <= 0) continue;
      var pn = String(pr.name || "").replace(/\s+/g, " ").trim().slice(0, 80);
      discounts.push({ kind:"discount", qty:1, unit:"ea", rate:-damt, label: pn || "Promotion",
                       detail: isPct ? (Math.min(pv, 100) + "% off") : "", amount:-damt });
      discountSum += damt;
    }
    var high       = Math.round((preDiscount - discountSum) * 100) / 100;
    var low        = Math.round(high * (1 - CONFIG.pricing.rangeSpread));

    return {
      levels:     results,
      custom:     extras,
      discounts:  discounts,
      totalSqft:  sqft,
      subtotal:   Math.round(subtotal),
      adjustment: adjustment,
      low:        low,
      high:       high,
      perSqft:    sqft > 0 ? Math.round(high / sqft) : 0,
      anyTbd:     anyTbd
    };
  }

  return { ovr:ovr, shown:shown, footings:footings, railLf:suggestedRailLf, addonLf:addonLf, addonQty:addonQty, tierAt:tierAt, railFor:railFor, level:level, total:total };
})();
</script>

<script>
/* ============================================================================
   3. STATE + RENDER
   ============================================================================ */

var state = {
  levels:   [newLevel()],
  count:    1,
  unlocked: false,
  lead:     null,
  notes:    "",
  /* Custom line items, [{name, amount}]. amount stays the text that was typed,
     so a half-typed number survives the re-render; Pricing.total() parses it. */
  custom:   [],
  promos:   [],
  /* Latched by the honeypot. Suppresses every CRM write for the session
     while leaving the calculator fully usable. */
  blocked:  false
};

function newLevel(){
  var addons = {};
  for(var i=0;i<CONFIG.addons.length;i++) addons[CONFIG.addons[i].key] = false;
  return {
    length:20, width:14,
    tier:0,
    /* railLfOverride and stepOverride follow the same pattern as
       footingOverride: null means "use the suggested value", a real number
       means the customer (or a rep) has overridden it. Nothing here is the
       actual priced value - level() and renderLevel() both compute that. */
    hasRail:true, railLfOverride:null, railType:"cinch", cocktailRail:false,
    hasSteps:true, stepOverride:null, stairWidth:null,
    hasWaterproof:false, waterproofSqft:null,
    hasDemo:false, demoSqft:null,
    footingOverride:null, addonQty:{},
    addons:addons,
    open:true
  };
}

/* Cheapest-first display order over stable indices. */
var TIER_ORDER = (function(){
  var order = [];
  for(var i=0;i<CONFIG.tiers.length;i++) order.push(i);
  order.sort(function(a,b){ return (CONFIG.tiers[a].psf - CONFIG.tiers[b].psf) || (a - b); });
  return order;
})();

var money = function(n){ return "$" + Math.round(n).toLocaleString("en-US"); };

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                  .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* ---------- configurator ---------- */

function renderConfig(){
  var box = document.getElementById("config");

  /* Every keystroke re-renders this panel, which used to drop the caret out of
     the field after one character. Remember which input had focus - by its
     position among the panel's inputs, checked against its label - and put
     the caret back afterwards. */
  var act = document.activeElement, keep = null;
  if(act && act.tagName === "INPUT" && box.contains(act) && act.type !== "checkbox"){
    keep = { i: Array.prototype.indexOf.call(box.querySelectorAll("input"), act),
             label: act.getAttribute("aria-label"), start: null, end: null };
    try{ keep.start = act.selectionStart; keep.end = act.selectionEnd; }catch(e){}
  }

  var html = "";

  for(var n=0;n<state.count;n++){
    var d = state.levels[n];
    html += renderLevel(n, d);
  }

  if(state.count < CONFIG.maxLevels){
    html += '<button class="btn-add" onclick="addLevel()">+ Add ' +
            (state.count === 1 ? "second" : "third") + ' deck level</button>';
  }

  /* Custom line items: only where customLineItems is set, which is the portal
     copy. A website visitor is never offered a box to type their own price. */
  if(CONFIG.customLineItems > 0){
    html += '<div class="level"><div class="levelbody"><div class="field">';
    html +=   '<div class="flabel">Custom line items <span class="fhint">added exactly as entered &middot; negative for a discount</span></div>';
    for(var c=0;c<state.custom.length;c++){
      var ci = state.custom[c] || {};
      html += '<div class="inline" style="margin-top:6px;">';
      html +=   '<input type="text" value="' + esc(ci.name || "") + '" placeholder="What is this for? (e.g. Gas)" maxlength="80" style="flex:1;min-width:130px;" aria-label="Custom item ' + (c+1) + ' description" oninput="setCustom(' + c + ',\'name\',this.value)">';
      html +=   '<span class="unit">$</span>';
      html +=   '<input type="number" value="' + esc(ci.amount == null ? "" : ci.amount) + '" step="any" style="width:96px;" aria-label="Custom item ' + (c+1) + ' price" oninput="setCustom(' + c + ',\'amount\',this.value)">';
      html +=   '<button type="button" onclick="removeCustom(' + c + ')" aria-label="Remove custom item ' + (c+1) + '" title="Remove" style="background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:inherit;opacity:.6;padding:0 4px;">&times;</button>';
      html += '</div>';
    }
    if(state.custom.length < CONFIG.customLineItems){
      html += '<button type="button" class="btn-add" style="margin-top:8px;" onclick="addCustom()">+ Add line item</button>';
    }
    html += '</div></div></div>';
  }

  /* Promotions: portal copy only, like the custom line items. */
  if(CONFIG.promotions > 0){
    html += '<div class="level"><div class="levelbody"><div class="field">';
    html +=   '<div class="flabel">Promotions <span class="fhint">a percent is taken off the total before promotions</span></div>';
    for(var pi=0;pi<state.promos.length;pi++){
      var po = state.promos[pi] || {};
      html += '<div class="inline" style="margin-top:6px;">';
      html +=   '<input type="text" value="' + esc(po.name || "") + '" placeholder="Promotion name (e.g. Spring special)" maxlength="80" style="flex:1;min-width:130px;" aria-label="Promotion ' + (pi+1) + ' name" oninput="setPromo(' + pi + ',\'name\',this.value)">';
      html +=   '<input type="number" value="' + esc(po.value == null ? "" : po.value) + '" step="any" min="0" style="width:84px;" aria-label="Promotion ' + (pi+1) + ' discount" oninput="setPromo(' + pi + ',\'value\',this.value)">';
      html +=   '<select aria-label="Promotion ' + (pi+1) + ' type" onchange="setPromo(' + pi + ',\'type\',this.value)">';
      html +=     '<option value="percent"' + (po.type === "dollar" ? "" : " selected") + '>% off</option>';
      html +=     '<option value="dollar"' + (po.type === "dollar" ? " selected" : "") + '>$ off</option>';
      html +=   '</select>';
      html +=   '<button type="button" onclick="removePromo(' + pi + ')" aria-label="Remove promotion ' + (pi+1) + '" title="Remove" style="background:none;border:0;cursor:pointer;font-size:20px;line-height:1;color:inherit;opacity:.6;padding:0 4px;">&times;</button>';
      html += '</div>';
    }
    if(state.promos.length < CONFIG.promotions){
      html += '<button type="button" class="btn-add" style="margin-top:8px;" onclick="addPromo()">+ Add promotion</button>';
    }
    html += '</div></div></div>';
  }

  box.innerHTML = html;

  if(keep && keep.i > -1){
    var again = box.querySelectorAll("input")[keep.i];
    if(again && again.getAttribute("aria-label") === keep.label){
      again.focus();
      if(keep.start !== null){
        try{ again.setSelectionRange(keep.start, keep.end); }catch(e){}
      }else{
        /* Number inputs have no selection API. Re-assigning the value is what
           moves the caret to the end, where it was while typing. */
        var v = again.value; again.value = ""; again.value = v;
      }
    }
  }
}

function renderLevel(n, d){
  var sqft = d.length * d.width;
  var screws = Pricing.shown(d.footingOverride, Pricing.footings(sqft));
  var suggestedRailLf = Pricing.railLf(d.length, d.width);
  var railLf = Pricing.shown(d.railLfOverride, suggestedRailLf);
  var stepCount = Pricing.shown(d.stepOverride, CONFIG.pricing.standardSteps);
  var open = d.open;
  var h = "";

  h += '<div class="level">';
  h +=   '<button class="levelhead' + (open ? " open" : "") + '" onclick="toggleLevel(' + n + ')" aria-expanded="' + open + '">';
  h +=     '<span class="lh-left">';
  h +=       '<span class="lnum" style="background:' + CONFIG.levelColors[n] + ';">' + (n+1) + '</span>';
  h +=       '<span class="ltitle">' + esc(CONFIG.levelNames[n]) + '</span>';
  h +=       '<span class="lsqft">' + sqft + ' sqft</span>';
  h +=     '</span>';
  h +=     '<span class="lh-right">';
  if(n > 0){
    h +=     '<span class="btn-remove" role="button" tabindex="0" onclick="event.stopPropagation();removeLevel(' + n + ')">Remove</span>';
  }
  h +=       '<span class="chev' + (open ? " open" : "") + '">&#9660;</span>';
  h +=     '</span>';
  h +=   '</button>';

  if(open){
    h += '<div class="levelbody">';

    /* dimensions */
    h += '<div class="field">';
    h +=   '<div class="flabel">Deck dimensions</div>';
    h +=   '<div class="fsub">Length x width, in feet</div>';
    h +=   '<div class="inline">';
    h +=     '<input type="number" value="' + d.length + '" min="4" max="150" aria-label="Length in feet" oninput="setField(' + n + ',\'length\',+this.value)">';
    h +=     '<span class="unit">ft x</span>';
    h +=     '<input type="number" value="' + d.width + '" min="4" max="150" aria-label="Width in feet" oninput="setField(' + n + ',\'width\',+this.value)">';
    h +=     '<span class="unit">ft = <strong>' + sqft + '</strong> sqft</span>';
    h +=   '</div>';
    h += '</div>';

    /* footings */
    h += '<div class="field">';
    h +=   '<div class="flabel">Concrete footings <span class="fhint">suggested: ' + Pricing.footings(sqft) + ' &middot; 0 if reusing existing</span></div>';
    h +=   '<div class="inline">';
    h +=     '<input type="number" value="' + screws + '" min="0" max="40" aria-label="Number of concrete footings" oninput="setField(' + n + ',\'footingOverride\',this.value)">';
    h +=     '<span class="unit">footings &middot; $' + CONFIG.pricing.footingEach + ' each</span>';
    h +=   '</div>';
    h += '</div>';

    /* material */
    h += '<div class="field"><div class="flabel">Decking material</div><div class="tiers">';
    for(var i=0;i<TIER_ORDER.length;i++){
      var ti = TIER_ORDER[i], t = CONFIG.tiers[ti];
      if(t.hidden && d.tier !== ti) continue;
      var sel = d.tier === ti;
      h += '<button class="tier' + (sel ? " sel" : "") + '" onclick="setField(' + n + ',\'tier\',' + ti + ')" aria-pressed="' + sel + '">';
      h +=   '<span class="tierrow"><span class="tiername">' + esc(t.mfr + " " + t.name) + '</span>';
      h +=   '<span class="tierprice">$' + t.psf + '/sqft</span></span>';
      h +=   '<span class="tiersub">' + esc(t.sub) +
             '<span class="tag ' + (t.confirmed ? "tag-conf" : "tag-est") + '">' +
             (t.confirmed ? "confirmed" : "est.") + '</span></span>';
      h += '</button>';
    }
    h += '</div></div>';

    /* railing */
    h += '<div class="field"><div class="flabel">Railing</div>';
    h +=   yesNo(n, "hasRail", d.hasRail);
    if(d.hasRail){
      h += '<div class="rails">';
      for(var r=0;r<CONFIG.rails.length;r++){
        var rail = CONFIG.rails[r], rsel = d.railType === rail.key;
        h += '<button class="rail' + (rsel ? " sel" : "") + '" onclick="setField(' + n + ',\'railType\',\'' + rail.key + '\')" aria-pressed="' + rsel + '">';
        h +=   '<span class="railswatch" style="background:' + rail.swatch + ';">' + esc(rail.short) + '</span>';
        h +=   '<span class="railinfo"><span class="railname">' + esc(rail.name) + '</span><br>';
        h +=   '<span class="railprice">' + esc(rail.priceLabel || ('$' + rail.price + '/lf')) + '</span></span>';
        h += '</button>';
      }
      h += '</div>';
      h += '<div class="inline" style="margin-top:7px;">';
      h +=   '<input type="number" value="' + railLf + '" min="0" max="600" aria-label="Railing linear feet" oninput="setField(' + n + ',\'railLfOverride\',this.value)">';
      h +=   '<span class="unit">linear feet <span class="fhint">suggested: ' + suggestedRailLf + '</span></span>';
      h += '</div>';
      h += '<label class="addon" style="margin-top:9px;"><input type="checkbox"' + (d.cocktailRail ? " checked" : "") +
           ' onchange="setField(' + n + ',\'cocktailRail\',this.checked)"> Cocktail rail (flat board top) <span>&mdash; quoted on site</span></label>';
    }
    h += '</div>';

    /* stairs */
    var tierNow = Pricing.tierAt(d.tier), baseW = CONFIG.pricing.stairBaseWidth;
    h += '<div class="field">';
    h +=   '<div class="flabel">Stairs <span class="fhint">$' + tierNow.stair + '/stair at ' + baseW + ' ft wide &middot; suggested: ' + CONFIG.pricing.standardSteps + '</span></div>';
    h +=   yesNo(n, "hasSteps", d.hasSteps);
    if(d.hasSteps){
      h += '<div class="inline" style="margin-top:6px;">';
      h +=   '<input type="number" value="' + stepCount + '" min="1" max="40" aria-label="Number of steps" oninput="setField(' + n + ',\'stepOverride\',this.value)">';
      h +=   '<span class="unit">steps</span>';
      h +=   '<input type="number" value="' + Pricing.shown(d.stairWidth, baseW) + '" min="3" max="20" step="0.5" aria-label="Stair width in feet" oninput="setField(' + n + ',\'stairWidth\',this.value)">';
      h +=   '<span class="unit">ft wide <span class="fhint">+$' + tierNow.stairLf + ' a stair per foot over ' + baseW + '</span></span>';
      h += '</div>';
    }
    h += '</div>';

    /* waterproofing */
    h += '<div class="field">';
    h +=   '<div class="flabel">Waterproofing <span class="fhint">RainEscape &middot; $' + CONFIG.pricing.waterproofPsf + '/sqft</span></div>';
    h +=   yesNo(n, "hasWaterproof", d.hasWaterproof);
    if(d.hasWaterproof){
      h += '<div class="inline" style="margin-top:6px;">';
      h +=   '<input type="number" value="' + (d.waterproofSqft || sqft) + '" min="1" max="3000" style="width:76px;" aria-label="Waterproofed square feet" oninput="setField(' + n + ',\'waterproofSqft\',+this.value)">';
      h +=   '<span class="unit">sqft</span>';
      h += '</div>';
    }
    h += '</div>';

    /* demo: its own section, not an add-on */
    h += '<div class="field">';
    h +=   '<div class="flabel">Remove existing deck <span class="fhint">demo and disposal &middot; $' + CONFIG.pricing.demoPsf + '/sqft</span></div>';
    h +=   yesNo(n, "hasDemo", d.hasDemo);
    if(d.hasDemo){
      h += '<div class="inline" style="margin-top:6px;">';
      h +=   '<input type="number" value="' + (d.demoSqft || sqft) + '" min="1" max="3000" style="width:76px;" aria-label="Demo square feet" oninput="setField(' + n + ',\'demoSqft\',+this.value)">';
      h +=   '<span class="unit">sqft of old deck</span>';
      h += '</div>';
    }
    h += '</div>';

    /* add-ons */
    h += '<div class="field"><div class="flabel">Add-ons &amp; upgrades</div><div class="addons">';
    for(var a=0;a<CONFIG.addons.length;a++){
      var ad = CONFIG.addons[a], adOn = !!d.addons[ad.key];
      h += '<label class="addon"><input type="checkbox"' + (adOn ? " checked" : "") +
           ' onchange="setAddon(' + n + ',\'' + ad.key + '\',this.checked)"> ' +
           esc(ad.label) + ' <span>&mdash; ' + (ad.rate ? '$' + ad.rate + '/' + ad.per : 'quoted on site') + '</span></label>';
      if(adOn && ad.rate && ad.per === "lf"){
        h += '<div class="inline" style="margin:-2px 0 2px 22px;">';
        h +=   '<input type="number" value="' + Pricing.addonQty(d, ad) + '" min="1" max="600" aria-label="' + esc(ad.label) + ' linear feet" oninput="setAddonQty(' + n + ',\'' + ad.key + '\',+this.value)">';
        h +=   '<span class="unit">linear feet <span class="fhint">suggested: ' + Pricing.addonLf(d) + '</span></span>';
        h += '</div>';
      }
    }
    h += '</div></div>';

    h += '</div>';
  }

  h += '</div>';
  return h;
}

function yesNo(n, key, val){
  return '<div class="pillrow">' +
    '<button class="pill' + (val ? " on" : "") + '" onclick="setField(' + n + ',\'' + key + '\',true)" aria-pressed="' + val + '">Yes</button>' +
    '<button class="pill' + (!val ? " on" : "") + '" onclick="setField(' + n + ',\'' + key + '\',false)" aria-pressed="' + !val + '">No</button>' +
  '</div>';
}

/* ---------- estimate output ---------- */

/* The same estimate with every level's decking swapped to each Good/Better/Best
   material in turn. Only the material changes (decking per sqft and the
   per-stair rate follow it); a material already chosen on every level is
   left out, so the box only ever shows alternatives. */
function materialAlternatives(t){
  var lv = state.levels.slice(0, state.count), out = [];
  for(var i=0;i<CONFIG.materialCompare.length;i++){
    var mc = CONFIG.materialCompare[i], tier = CONFIG.tiers[mc.tierIdx];
    if(!tier) continue;
    var same = lv.every(function(d){ return d.tier === mc.tierIdx; });
    if(same) continue;
    var swapped = lv.map(function(d){
      var c = {}; for(var k in d){ if(Object.prototype.hasOwnProperty.call(d, k)) c[k] = d[k]; }
      c.tier = mc.tierIdx; return c;
    });
    var alt = Pricing.total(swapped, state.custom, state.promos);
    out.push({ label:mc.label, name:tier.mfr + " " + tier.name, low:alt.low, high:alt.high, diff:Math.round(alt.high - t.high) });
  }
  return out;
}

function renderOut(){
  var t = Pricing.total(state.levels.slice(0, state.count), state.custom, state.promos);
  var b = CONFIG.business;
  var showReal = state.unlocked;
  var h = "";

  /* hero */
  h += '<div class="lockwrap' + (showReal ? " open" : "") + '">';
  h +=   '<div class="locked">';
  h +=     '<div class="card hero">';
  h +=       '<div class="herometa">' +
              (state.count > 1 ? state.count + "-level deck" : "Single-level deck") +
              ' &middot; ' + t.totalSqft + ' sqft &middot; fully installed</div>';
  h +=       '<div class="heroprice">' + money(t.low) + ' &ndash; ' + money(t.high) + '</div>';
  h +=       '<div class="herosub">All materials and labor included' +
              (t.anyTbd ? ' <em>+ add-ons quoted on site</em>' : '') + '</div>';
  h +=       '<div class="herostats">';
  h +=         '<div><div class="statlabel">Per sqft</div><div class="statvalue">~$' + t.perSqft + '</div></div>';
  h +=         '<div><div class="statlabel">Total area</div><div class="statvalue">' + t.totalSqft + ' sqft</div></div>';
  h +=         '<div><div class="statlabel">Deck levels</div><div class="statvalue">' + state.count + '</div></div>';
  h +=       '</div>';
  h +=     '</div>';
  var alts = materialAlternatives(t);
  if(alts.length){
    h += '<div class="card altmat"><div class="althead">Compare materials' + (state.count > 1 ? ' (all levels)' : '') + '</div>';
    for(var ai=0;ai<alts.length;ai++){
      var a = alts[ai];
      h += '<div class="altrow">If you went with <b>' + esc(a.label) + '</b> material (' + esc(a.name) + '), it would be ' +
           '<span class="altprice">' + money(a.low) + ' &ndash; ' + money(a.high) + '</span> ' +
           '<span class="altdiff">(' + (a.diff >= 0 ? '+' : '&minus;') + money(Math.abs(a.diff)) + ')</span></div>';
    }
    h += '</div>';
  }
  h +=   '</div>';
  if(!showReal){
    h += '<div class="lockover">';
    h +=   '<div class="locktitle">Your estimate is ready</div>';
    h +=   '<div class="locksub">Priced from real 3Sixty Industries jobs. Tell us where to send it and the number is yours.</div>';
    h +=   '<button class="btn-unlock" onclick="openGate()">Reveal my estimate &rarr;</button>';
    h += '</div>';
  }
  h += '</div>';

  /* breakdown */
  h += '<div class="lockwrap' + (showReal ? " open" : "") + '">';
  h +=   '<div class="locked"><div class="card">';
  h +=     '<div class="cardhead">Estimate breakdown</div>';
  h +=     '<div class="tablewrap"><table>';
  h +=       '<thead><tr><th>Item</th><th>Details</th><th class="num">Price</th></tr></thead><tbody>';

  for(var i=0;i<t.levels.length;i++){
    var lv = t.levels[i];
    {
      h += '<tr class="rowsection"><td colspan="3">' + esc(CONFIG.levelNames[i]) + ' &mdash; ' + lv.sqft + ' sqft</td></tr>';
    }
    for(var j=0;j<lv.items.length;j++){
      var it = lv.items[j];
      h += '<tr><td>' + esc(it.label) + '</td><td class="num detail">' + esc(it.detail) + '</td>' +
           '<td class="num">' + money(it.amount) + '</td></tr>';
    }
    for(var k=0;k<lv.tbd.length;k++){
      h += '<tr><td>' + esc(lv.tbd[k]) + '</td><td class="num detail">quoted on site</td>' +
           '<td class="num detail">TBD</td></tr>';
    }
  }

  /* This is the part the old build got wrong: the rows above now sum to the
     subtotal, the adjustment is its own visible row, and subtotal plus
     adjustment equals the top of the quoted range exactly. */
  h += '<tr class="rowsub"><td>Subtotal</td><td></td><td class="num">' + money(t.subtotal) + '</td></tr>';
  if(t.adjustment !== 0){
    var pct = Math.round((1 - CONFIG.pricing.adjustment) * 1000) / 10;
    h += '<tr class="rowadj"><td>Estimator adjustment</td><td class="num detail">&minus;' + pct + '%</td>' +
         '<td class="num">' + (t.adjustment < 0 ? "&minus;" : "") + money(Math.abs(t.adjustment)) + '</td></tr>';
  }
  /* Custom lines sit after the adjustment because they are not adjusted:
     subtotal + adjustment + custom lines equals the top of the range. */
  for(var cx=0;cx<t.custom.length;cx++){
    h += '<tr><td>' + esc(t.custom[cx].label) + '</td><td class="num detail">custom</td>' +
         '<td class="num">' + (t.custom[cx].amount < 0 ? "&minus;" : "") + money(Math.abs(t.custom[cx].amount)) + '</td></tr>';
  }
  for(var dx=0;dx<t.discounts.length;dx++){
    h += '<tr class="rowadj"><td>' + esc(t.discounts[dx].label) + '</td><td class="num detail">' + esc(t.discounts[dx].detail || "promotion") + '</td>' +
         '<td class="num">&minus;' + money(Math.abs(t.discounts[dx].amount)) + '</td></tr>';
  }
  h += '<tr class="rowtotal"><td>Your estimate</td><td></td><td class="num">' +
       money(t.low) + ' &ndash; ' + money(t.high) + '</td></tr>';
  h += '</tbody></table></div>';

  h += '<p class="note">Range low is ' + Math.round(CONFIG.pricing.rangeSpread * 100) +
       '% under the adjusted total, covering normal variation in site conditions. ' +
       'Based on real 3Sixty Industries jobs, ' + new Date().getFullYear() +
       '. Final price confirmed at your free on-site design consultation.</p>';
  h += '<p class="note" style="margin-bottom:2px;"><b>Included in every estimate:</b></p><ul class="note" style="margin:0 0 8px 18px;padding:0;">';
  inclusionsFor(t).forEach(function(x){ h += '<li>' + esc(x) + '</li>'; });
  h += '</ul>';
  h += '<p class="note"><b>Not included:</b> shading structures and concrete. ' +
       'Items marked TBD are quoted on site.</p>';
  h += '</div></div>';
  /* No second unlock button here - the blur alone signals what is behind it,
     and one call to action converts better than two identical ones. */
  h += '</div>';

  /* CTA */
  h += '<div class="ctabar">';
  h +=   '<div><div class="ctatitle">Ready for your exact quote?</div>';
  h +=   '<div class="ctasub">Free design consultation &middot; No commitment &middot; ' +
          esc(b.name) + ' &middot; ' + esc(b.phone) + '</div></div>';
  h +=   '<a class="btn-cta" href="' + esc(b.ctaUrl) + '" target="_blank" rel="noopener" onclick="sendEstimate(\'cta_click\')">' +
          esc(b.ctaLabel) + ' &rarr;</a>';
  h += '</div>';

  document.getElementById("out").innerHTML = h;
}

/* ---------- interaction ---------- */

function setField(n, key, value){
  var d = state.levels[n];
  if(!d) return;
  d[key] = value;
  /* Clearing the override lets the formula take over again. */
  /* Both suggestions are dimension-derived, so a resize invalidates any
     stale override the same way it does for footings. stepOverride is left
     alone - the step suggestion is a flat constant, not derived from
     length/width, so resizing the deck has no bearing on it. */
  if(key === "length" || key === "width"){ d.footingOverride = null; d.railLfOverride = null; d.addonQty = {}; }
  render();
}

function setAddon(n, key, checked){
  state.levels[n].addons[key] = checked;
  render();
}

/* The length typed for a per-foot add-on (soffit and gutters). */
function setAddonQty(n, key, value){
  var d = state.levels[n];
  if(!d) return;
  if(!d.addonQty) d.addonQty = {};
  d.addonQty[key] = value;
  render();
}

function setCustom(i, key, value){
  if(!state.custom[i]) state.custom[i] = { name:"", amount:"" };
  state.custom[i][key] = value;
  render();
}

function setPromo(i, key, value){
  if(!state.promos[i]) state.promos[i] = { name:"", type:"percent", value:"" };
  state.promos[i][key] = value;
  render();
}

function addPromo(){
  if(state.promos.length >= CONFIG.promotions) return;
  state.promos.push({ name:"", type:"percent", value:"" });
  render();
}

function removePromo(i){
  state.promos.splice(i, 1);
  render();
}

/* What every estimate already includes, from 3Sixty's own estimates (ten of them:
   framing, posts, brackets, joist tape and the picture frame border are on
   nearly all). Stair stringers follow what was entered; footings are priced on their own line, never listed here. */
function inclusionsFor(t){
  var list = [
    "2x10 Douglas fir framing",
    "6x6 posts",
    "Simpson hardware brackets",
    "Joist tape on the framing",
    "Picture frame border",
    "Decking and fascia in your chosen material"
  ];
  var lv = state.levels.slice(0, state.count), steps = false;
  for(var i=0;i<lv.length;i++){ if(lv[i].hasSteps) steps = true; }
  if(steps) list.push("Stairs built with 2x12 Douglas fir stringers");
  return list;
}

function addCustom(){
  if(state.custom.length >= CONFIG.customLineItems) return;
  state.custom.push({ name:"", amount:"" });
  render();
}

function removeCustom(i){
  state.custom.splice(i, 1);
  render();
}

function toggleLevel(n){
  state.levels[n].open = !state.levels[n].open;
  renderConfig();
  notifyHeight();
}

function addLevel(){
  if(state.count >= CONFIG.maxLevels) return;
  if(!state.levels[state.count]) state.levels[state.count] = newLevel();
  state.count++;
  render();
}

function removeLevel(n){
  state.levels.splice(n, 1);
  state.levels.push(newLevel());
  state.count--;
  render();
}

function render(){
  renderConfig();
  renderOut();
  notifyHeight();
  notifyEstimate();
  scheduleEstimateSend();
}
</script>

<script>
/* ============================================================================
   4. LEAD GATE + GOHIGHLEVEL CAPTURE
   ============================================================================ */

/* Attribution captured on load, forwarded with the lead. */
var attribution = (function(){
  var p = new URLSearchParams(window.location.search);
  return {
    gclid:        p.get("gclid") || "",
    utm_source:   p.get("utm_source") || document.referrer || "",
    utm_medium:   p.get("utm_medium") || "",
    utm_campaign: p.get("utm_campaign") || ""
  };
})();

/* Structured lines for a QuickBooks estimate. Priced items, then one
   adjustment line, then the TBD add-ons at $0 so they still appear on the
   estimate as "quoted at consultation". The adjustment is computed as
   high minus the sum of the rounded lines - not taken from t.adjustment - so
   the lines ALWAYS sum to exactly t.high, the top of the range the customer
   saw, even if a dimension had decimals. */
function buildLineItems(t){
  var lines = [], sum = 0;
  var cents = function(n){ return Math.round(n * 100) / 100; };

  for(var i=0;i<t.levels.length;i++){
    var lv = t.levels[i], levelName = CONFIG.levelNames[i];
    for(var j=0;j<lv.items.length;j++){
      var it = lv.items[j], amt = cents(it.amount);
      sum += amt;
      lines.push({
        kind:        it.kind,
        description: (t.levels.length > 1 ? levelName + " - " : "") + it.label,
        qty:         it.qty,
        unit:        it.unit,
        rate:        it.rate,
        amount:      amt
      });
    }
  }

  for(var cu=0;cu<t.custom.length;cu++){
    var ce = t.custom[cu];
    sum += ce.amount;
    lines.push({ kind:"custom", description:ce.label, qty:1, unit:"ea", rate:ce.amount, amount:ce.amount });
  }

  for(var dl=0;dl<t.discounts.length;dl++){
    var de = t.discounts[dl];
    sum += de.amount;
    lines.push({ kind:"discount", description:"Promotion: " + de.label + (de.detail ? " (" + de.detail + ")" : ""), qty:1, unit:"ea", rate:de.amount, amount:de.amount });
  }

  var adj = cents(t.high - sum);
  if(adj !== 0){
    lines.push({ kind:"adjustment", description:"Estimate adjustment", qty:1, unit:"ea", rate:adj, amount:adj });
  }

  for(var k=0;k<t.levels.length;k++){
    for(var m=0;m<t.levels[k].tbd.length;m++){
      lines.push({
        kind:        "addon_tbd",
        description: (t.levels.length > 1 ? CONFIG.levelNames[k] + " - " : "") +
                     t.levels[k].tbd[m] + " (quoted at consultation)",
        qty: 1, unit: "ea", rate: 0, amount: 0
      });
    }
  }
  return lines;
}

/* Flatten the whole configuration into the flat key/value shape both a GHL
   form prefill and a GHL inbound webhook expect. */
function buildPayload(){
  var t = Pricing.total(state.levels.slice(0, state.count), state.custom, state.promos);
  var materials = [], rails = [], steps = 0, railLf = 0, addons = {}, breakdown = [];

  for(var i=0;i<t.levels.length;i++){
    var lv = t.levels[i], d = state.levels[i];
    materials.push(lv.tier.mfr + " " + lv.tier.name.replace(/®/g,""));
    /* lv.railLf / lv.stepCount come from Pricing.level(), which already
       resolved the override-or-suggestion for each - reading d.railLf here
       would read a field that no longer exists now that both are optional
       overrides rather than always-set values. */
    if(d.hasRail){ rails.push(Pricing.railFor(d.railType).name); railLf += lv.railLf; }
    if(d.hasSteps) steps += lv.stepCount;
    for(var k=0;k<CONFIG.addons.length;k++){
      if(d.addons[CONFIG.addons[k].key]) addons[CONFIG.addons[k].label] = true;
    }
    if(d.hasRail && d.cocktailRail) addons["Cocktail rail"] = true;
    if(d.hasDemo) addons["Remove existing deck"] = true;
    breakdown.push(CONFIG.levelNames[i] + " (" + lv.sqft + " sqft): " +
      lv.items.map(function(it){ return it.label + " " + money(it.amount); }).join(", "));
  }

  var data = {
    line_items:  JSON.stringify(buildLineItems(t)),
    total_sqft:  t.totalSqft,
    deck_levels: state.count,
    material:    materials.join(" | "),
    rail_type:   rails.length ? rails.join(" | ") : "None",
    rail_lf:     railLf,
    steps:       steps,
    addons:      Object.keys(addons).join(", ") || "None",
    price_low:   t.low,
    price_high:  t.high,
    breakdown:   breakdown.join("\n"),
    notes:       state.notes || ""
  };

  if(state.lead){
    data.first_name  = state.lead.firstName;
    data.last_name   = state.lead.lastName;
    data.email       = state.lead.email;
    data.phone       = state.lead.phone;
    data.address     = state.lead.address;
    data.city        = state.lead.city;
    data.postal_code = state.lead.postalCode;
  }
  return data;
}

/* Translate our keys into the customer's GHL query keys. Anything not in the
   map is dropped, so an unmapped field can never overwrite a GHL field by
   accident, and an empty value is never sent for a mapped-but-blank field. */
function mapToGhl(data){
  var map = CONFIG.ghl.fieldMap, out = {};
  for(var ours in map){
    if(!map.hasOwnProperty(ours)) continue;
    var v = data[ours];
    if(v === undefined || v === null || v === "") continue;
    out[map[ours]] = v;
  }
  return out;
}

/* In "before" mode the gate fires before a deck exists, so the form must
   carry identity and attribution ONLY. Sending the deck fields here would
   push empty values into GHL and blank whatever the contact already had -
   the exact failure mode that broke the onboarding chain twice. */
function ghlFormSrc(){
  var q = new URLSearchParams();
  if(CONFIG.gateMode === "after"){
    var mapped = mapToGhl(buildPayload());
    for(var k in mapped){ if(mapped.hasOwnProperty(k)) q.set(k, mapped[k]); }
  }
  if(attribution.gclid) q.set("gclid", attribution.gclid);
  var sep = CONFIG.ghl.formUrl.indexOf("?") > -1 ? "&" : "?";
  return CONFIG.ghl.formUrl + sep + q.toString();
}

/* GHL webhooks send no CORS headers, so a browser POST has to be no-cors -
   and no-cors silently downgrades application/json to text/plain, which
   arrives in GHL as one unusable blob called "value". Form encoding survives
   both that and sendBeacon, which is why everything here is URLSearchParams. */
/* The gate fires before the customer has configured anything, so the deck at
   that moment is just our defaults. Sending it would write a 280 sqft Trex
   deck onto the contact that they never chose - and if they bounce, that is
   what the sales rep sees. Identity only here; the deck follows once real. */
var IDENTITY_ONLY = { estimate_unlocked:true };

function webhookBody(trigger){
  var body = new URLSearchParams();
  var data = buildPayload();
  if(IDENTITY_ONLY[trigger]){
    var identity = {};
    ["first_name","last_name","email","phone","address","city","postal_code","notes"]
      .forEach(function(k){ if(data[k]) identity[k] = data[k]; });
    data = identity;
  }
  var mapped = mapToGhl(data);
  for(var k in mapped){ if(mapped.hasOwnProperty(k)) body.set(k, mapped[k]); }
  body.set("trigger", trigger);
  body.set("gclid", attribution.gclid);
  body.set("utm_source", attribution.utm_source);
  body.set("utm_medium", attribution.utm_medium);
  body.set("utm_campaign", attribution.utm_campaign);
  return body;
}

function postToWebhook(trigger){
  if(!CONFIG.ghl.webhookUrl || state.blocked) return;
  try{
    fetch(CONFIG.ghl.webhookUrl, { method:"POST", mode:"no-cors", body:webhookBody(trigger) })
      .catch(function(e){ if(window.console) console.warn("GHL webhook:", e); });
  }catch(e){ if(window.console) console.warn("GHL webhook:", e); }
}

function sendEstimate(trigger){
  if(!state.unlocked) return;
  postToWebhook(trigger);
}

/* Gate-first means the deck is built AFTER we already have the contact, so
   the configuration has to be pushed separately. Three moments catch it:
   they stop fiddling, they click the CTA, or they leave the page.
   The original used a blind 120s timer, which missed anyone who left at 90
   seconds and re-sent for anyone who stayed. */
var idleTimer = null;
function scheduleEstimateSend(){
  if(!state.unlocked || !CONFIG.ghl.webhookUrl) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function(){ sendEstimate("idle"); }, 45000);
}

/* pagehide fires on close, back, and mobile app-switch, where fetch is killed
   mid-flight. sendBeacon survives it and sets a form-encoded content type. */
window.addEventListener("pagehide", function(){
  if(!state.unlocked || !CONFIG.ghl.webhookUrl) return;
  clearTimeout(idleTimer);
  try{
    if(navigator.sendBeacon) navigator.sendBeacon(CONFIG.ghl.webhookUrl, webhookBody("exit"));
  }catch(e){}
});

/* ---------- the modal ---------- */

function isInlineGate(){ return CONFIG.gatePresentation === "inline"; }

function openGate(){
  var usingGhl = !!CONFIG.ghl.formUrl;
  var html = usingGhl ? gateGhlForm() : gateBuiltIn();

  if(isInlineGate()){
    var section = document.getElementById("gatesection");
    section.innerHTML = '<div class="gatecard">' + html + '</div>';
    section.classList.add("show");
    /* Deliberately no autofocus here - stealing focus on page load would
       scroll the host page to the iframe before the visitor has read
       anything. The modal can focus, because opening it was an action. */

    /* #gatesection sits ABOVE #app in the DOM, so in "after" mode the gate
       opens off-screen behind a visitor who has scrolled down to their
       blurred price - the Reveal button would look like it did nothing.
       Scrolling is only correct here because opening the gate was a click,
       never on load, which is why this is fenced to "after". */
    if(CONFIG.gateMode === "after"){
      try{ section.scrollIntoView({ behavior:"smooth", block:"start" }); }
      catch(e){ section.scrollIntoView(); }
      /* When the host page auto-heights this iframe there is no inner
         scrollbar to move, so the OUTER page has to do the scrolling. */
      try{ window.parent.postMessage({ scrollToIframe:true }, "*"); }catch(e){}
    }
  }else{
    var modal = document.getElementById("modal");
    modal.classList.toggle("wide", usingGhl);
    modal.innerHTML = html;
    document.getElementById("overlay").classList.add("show");
    if(!usingGhl){
      var first = modal.querySelector("input");
      if(first) first.focus();
    }
  }

  if(usingGhl) loadFormEmbedScript();
  notifyHeight();
}

/* Only the modal can be dismissed. Hiding an inline gate would leave the
   visitor staring at a blurred page with no way back in. */
function closeGate(){
  if(isInlineGate()) return;
  document.getElementById("overlay").classList.remove("show");
}

function gateHeader(){
  var t = Pricing.total(state.levels.slice(0, state.count), state.custom, state.promos);
  var h = "";
  h += '<div class="g-brand">' + esc(CONFIG.business.name) + '</div>';
  h += '<div class="g-head" id="gatehead">Your <em>free</em> deck cost estimate</div>';
  h += '<div class="g-sub">Built from real material costs and labor on jobs we have actually run &mdash; ' +
       'typically within 0&ndash;5% of the final quote.</div>';
  h += '<div class="g-preview"><div class="g-price">' + money(t.low) + ' &ndash; ' + money(t.high) +
       '</div><div class="g-plabel">' +
       (CONFIG.gateMode === "before" ? "example estimate" : "your estimate &middot; " + t.totalSqft + " sqft") +
       '</div></div>';
  return h;
}

/* The data-* attributes are not decoration - form_embed.js scans for them to
   find the iframe it should resize. Without data-form-id and the matching
   data-layout-iframe-id the form renders at a fixed height and clips. */
function gateGhlForm(){
  var id = ghlFormId();
  return gateHeader() +
    '<div class="gateform">' +
    '<iframe id="inline-' + esc(id) + '"' +
      ' src="' + esc(ghlFormSrc()) + '"' +
      ' style="width:100%;height:' + CONFIG.ghl.formHeight + 'px;border:none;border-radius:8px;display:block;"' +
      ' data-layout="{\'id\':\'INLINE\'}"' +
      ' data-trigger-type="alwaysShow"' +
      ' data-activation-type="alwaysActivated"' +
      ' data-deactivation-type="neverDeactivate"' +
      ' data-form-name="calculator form 1"' +
      ' data-height="' + CONFIG.ghl.formHeight + '"' +
      ' data-layout-iframe-id="inline-' + esc(id) + '"' +
      ' data-form-id="' + esc(id) + '"' +
      ' data-cookie-consent="true"' +
      ' data-cookie-consent-provider="auto"' +
      ' title="Get your deck estimate"></iframe>' +
    '</div>' +
    /* Safety net. If GHL changes its postMessage payload, or a browser
       blocks it, the customer would submit the form and sit here forever.
       This always works. */
    '<div class="g-fine">Already submitted? ' +
      '<button type="button" class="linkbtn" onclick="unlock()">Continue to my estimate &rarr;</button>' +
    '</div>';
}

function ghlFormId(){
  var parts = CONFIG.ghl.formUrl.split("?")[0].split("/");
  return parts[parts.length - 1] || "";
}

/* Loaded once, on first gate open, so a visitor who never reaches the gate
   never pays for it. */
var embedScriptLoaded = false;
function loadFormEmbedScript(){
  if(embedScriptLoaded || !CONFIG.ghl.formEmbedScript) return;
  embedScriptLoaded = true;
  var s = document.createElement("script");
  s.src = CONFIG.ghl.formEmbedScript;
  s.async = true;
  s.onerror = function(){
    if(window.console) console.warn("GHL form_embed.js failed to load - the form will not auto-resize.");
  };
  document.body.appendChild(s);
}

function gateBuiltIn(){
  var h = gateHeader();
  h += '<div class="frow">';
  h +=   field("gf-first", "First name", "text", "Jordan");
  h +=   field("gf-last",  "Last name",  "text", "Goff");
  h += '</div>';
  h += field("gf-email", "Email", "email", "you@email.com");
  h += field("gf-phone", "Phone", "tel", "(801) 555-0100");
  h += field("gf-address", "Street address", "text", "1234 Main St");
  h += '<div class="frow3">';
  h +=   field("gf-city", "City", "text", "Sandy");
  h +=   field("gf-zip",  "Zip",  "text", "84094");
  h += '</div>';
  /* Honeypot. Hidden from people, irresistible to naive bots. A GHL form
     would have brought its own spam protection; this one has to carry its
     own or the CRM fills up with junk contacts. */
  h += '<div class="hp" aria-hidden="true">' +
         '<label for="gf-company">Company</label>' +
         '<input type="text" id="gf-company" tabindex="-1" autocomplete="off">' +
       '</div>';
  h += '<button class="btn-gate" id="gatebtn" onclick="submitGate()">Show me my estimate &rarr;</button>';
  h += '<div class="g-fine">No commitment &nbsp;&middot;&nbsp; Your info is never sold &nbsp;&middot;&nbsp; ' +
       esc(CONFIG.business.name) + '</div>';
  return h;
}

function field(id, label, type, placeholder){
  return '<div class="fgroup">' +
    '<label for="' + id + '">' + esc(label) + '</label>' +
    '<input type="' + type + '" id="' + id + '" placeholder="' + esc(placeholder) + '">' +
    '<div class="errmsg" id="' + id + '-err">Required</div>' +
  '</div>';
}

function submitGate(){
  var get = function(id){ return (document.getElementById(id).value || "").trim(); };

  /* A real person cannot see or tab to this field. If it is filled, unlock
     the calculator anyway so a false positive never blocks a customer -
     just skip the CRM write. */
  if(get("gf-company") !== ""){
    state.lead = null;
    /* Nulling the lead stops the identity write, but the deck still goes out
       on idle, CTA and exit - which would leave orphaned junk in the webhook
       log. Latch it off for the rest of the session instead. */
    state.blocked = true;
    unlock();
    return;
  }

  var v = {
    firstName: get("gf-first"), lastName: get("gf-last"),
    email:     get("gf-email"), phone:    get("gf-phone"),
    address:   get("gf-address"), city:   get("gf-city"),
    postalCode:get("gf-zip")
  };

  var ok = true;
  function check(id, valid, message){
    var input = document.getElementById(id), err = document.getElementById(id + "-err");
    input.classList.toggle("err", !valid);
    err.classList.toggle("show", !valid);
    if(message) err.textContent = message;
    if(!valid) ok = false;
  }
  check("gf-first",   v.firstName.length > 0);
  check("gf-last",    v.lastName.length > 0);
  check("gf-email",   /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email), "Enter a valid email address");
  check("gf-phone",   v.phone.replace(/\D/g,"").length >= 10, "Enter a 10-digit phone number");
  check("gf-address", v.address.length > 3);
  check("gf-city",    v.city.length > 0);
  check("gf-zip",     /^\d{5}$/.test(v.postalCode), "5-digit ZIP");
  if(!ok) return;

  state.lead = v;
  unlock();
  postToWebhook("estimate_unlocked");
  trackConversion();
}

function unlock(){
  if(state.unlocked) return;   /* GHL can fire more than one submit message */
  state.unlocked = true;

  document.getElementById("overlay").classList.remove("show");
  var section = document.getElementById("gatesection");
  section.classList.remove("show");
  section.innerHTML = "";      /* drop the iframe so it stops loading */

  /* Gate-first hides the whole app behind the mock until this moment. */
  document.getElementById("mock").classList.remove("show");
  document.getElementById("app").style.display = "";
  if(state.lead){
    document.getElementById("namebadge").textContent =
      state.lead.firstName + " " + state.lead.lastName;
  }
  render();
}

/* A native GHL form lives in a cross-origin iframe, so the only signal we get
   back is a postMessage. GHL's payload shape has changed before, so accept
   anything that looks like a submit rather than matching one exact string. */
/* Trust the form's OWN origin, read from formUrl, rather than a hardcoded
   list. GHL agencies white-label the widget domain - this one is
   link.midasmediafirm.com, so a check for "leadconnectorhq.com" would
   reject every message and the calculator would never unlock. */
function trustedFormOrigin(){
  try{ return new URL(CONFIG.ghl.formUrl, window.location.href).origin; }
  catch(e){ return null; }
}

window.addEventListener("message", function(e){
  if(!CONFIG.ghl.formUrl) return;
  if(e.origin !== trustedFormOrigin()) return;
  var text = typeof e.data === "string" ? e.data : JSON.stringify(e.data || "");
  /* GHL has changed this payload shape before, so match loosely on intent
     rather than one exact string - but only from the origin above. */
  if(/submit|success|complete/i.test(text)){ unlock(); return; }
  /* Anything else from the form is usually form_embed.js resizing it, which
     changes our own height - tell the host page so the outer iframe grows. */
  notifyHeight();
});

function trackConversion(){
  try{
    if(window.fbq) fbq("track","Lead",{content_name:"Deck Estimator",currency:"USD",value:0});
    if(window.gtag) gtag("event","generate_lead",{event_category:"estimator"});
  }catch(e){}
}

/* ---------- iframe auto-height for the GHL page embed ---------- */
var lastHeight = 0;
function notifyHeight(){
  var h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
  if(Math.abs(h - lastHeight) > 10){
    lastHeight = h;
    try{ window.parent.postMessage({ iframeHeight:h }, "*"); }catch(e){}
  }
}
window.addEventListener("resize", notifyHeight);
window.addEventListener("load", function(){ setTimeout(notifyHeight, 120); });

/* ---------- current estimate for the framing page (Golden Eye portal only) ---------- */
/* ---------- PDF export (portal copy and the staff GHL page, CONFIG.pdfExport) ---------- */
/* The estimate as a one-or-two page PDF a rep can save or send. jsPDF is loaded
   the first time the button is used, so nothing is fetched until then. The
   model is built from the same buildLineItems() the QuickBooks estimate uses,
   so the PDF and the QuickBooks lines can never say different things. */
var JSPDF_URL = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";

/* jsPDF's built-in fonts only cover Latin-1; drop anything else. */
function pdfText(s){
  var out = "", str = String(s == null ? "" : s);
  for(var i=0;i<str.length;i++){
    var c = str.charCodeAt(i);
    if(c === 174 || c === 153) continue;          /* registered / trademark marks */
    if(c === 183){ out += "-"; continue; }       /* middle dot */
    out += ((c >= 32 && c <= 126) || (c >= 160 && c <= 255)) ? str.charAt(i) : (c === 10 ? " " : "");
  }
  return out;
}

function pdfMoney(n){
  var neg = n < 0, v = Math.abs(n);
  var s = "$" + v.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });
  return neg ? "-" + s : s;
}

function pdfFileName(preparedFor, d){
  var base = "", p = String(preparedFor || "");
  for(var i=0;i<p.length;i++){
    var c = p.charCodeAt(i);
    var ok = (c >= 48 && c <= 57) || (c >= 65 && c <= 90) || (c >= 97 && c <= 122);
    base += ok ? p.charAt(i) : (base.length && base.charAt(base.length-1) !== "-" ? "-" : "");
  }
  while(base.length && base.charAt(base.length-1) === "-") base = base.slice(0, -1);
  var day = d.getFullYear() + "-" + ("0" + (d.getMonth()+1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
  return "3Sixty-Estimate" + (base ? "-" + base : "") + "-" + day + ".pdf";
}

/* Everything the PDF says, as plain data. */
function pdfModel(preparedFor){
  var t = Pricing.total(state.levels.slice(0, state.count), state.custom, state.promos);
  var rows = buildLineItems(t).map(function(l){
    var detail = "";
    if(l.kind === "addon_tbd") detail = "quoted on site";
    else if(l.qty !== 1 && l.unit !== "ea" && l.unit !== "job") detail = l.qty + " " + l.unit + " x " + pdfMoney(l.rate);
    else if(l.qty !== 1) detail = l.qty + " x " + pdfMoney(l.rate);
    return { text: pdfText(l.description), detail: pdfText(detail), amount: l.kind === "addon_tbd" ? "TBD" : pdfMoney(l.amount) };
  });
  var d = new Date();
  return {
    business: pdfText(CONFIG.business.name), phone: pdfText(CONFIG.business.phone),
    date: d.toLocaleDateString("en-US", { year:"numeric", month:"long", day:"numeric" }),
    fileName: pdfFileName(preparedFor, d),
    preparedFor: pdfText(preparedFor || ""),
    rows: rows, total: pdfMoney(t.high),
    inclusions: inclusionsFor(t).map(pdfText),
    notes: pdfText(state.notes || "")
  };
}

/* Draw the model with a jsPDF constructor. Letter size, points. */
function drawPdf(JsPDF, m){
  var doc = new JsPDF({ unit:"pt", format:"letter" });
  var L = 48, R = 564, bottom = 735, y = 60;
  var green = [38, 70, 52], grey = [110, 110, 110];
  function ensure(h){ if(y + h > bottom){ doc.addPage(); y = 56; } }

  doc.setFont("helvetica", "bold"); doc.setFontSize(20); doc.setTextColor(green[0], green[1], green[2]);
  doc.text(m.business, L, y);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(grey[0], grey[1], grey[2]);
  doc.text("Deck estimate", R, y - 12, { align:"right" });
  doc.text(m.date, R, y + 2, { align:"right" });
  y += 20;
  if(m.phone){ doc.text(m.phone, L, y); y += 14; }
  if(m.preparedFor){
    y += 8; doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(30, 30, 30);
    doc.text("Prepared for: " + m.preparedFor, L, y); y += 6;
  }
  y += 14; doc.setDrawColor(200, 200, 200); doc.line(L, y, R, y); y += 18;

  doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(grey[0], grey[1], grey[2]);
  doc.text("ITEM", L, y); doc.text("DETAIL", 350, y); doc.text("AMOUNT", R, y, { align:"right" });
  y += 8; doc.line(L, y, R, y); y += 16;

  doc.setFontSize(10.5);
  m.rows.forEach(function(r){
    var lines = doc.splitTextToSize(r.text, 290);
    var det = doc.splitTextToSize(r.detail, 130);
    var h = Math.max(lines.length, det.length) * 13 + 7;
    ensure(h);
    doc.setFont("helvetica", "normal"); doc.setTextColor(30, 30, 30);
    doc.text(lines, L, y);
    doc.setTextColor(grey[0], grey[1], grey[2]); doc.setFontSize(9.5);
    doc.text(det, 350, y); doc.setFontSize(10.5);
    doc.setTextColor(30, 30, 30);
    doc.text(r.amount, R, y, { align:"right" });
    y += h;
  });

  ensure(44); y += 2; doc.setDrawColor(green[0], green[1], green[2]); doc.line(L, y, R, y); y += 22;
  doc.setFont("helvetica", "bold"); doc.setFontSize(14); doc.setTextColor(green[0], green[1], green[2]);
  doc.text("Estimate total", L, y); doc.text(m.total, R, y, { align:"right" }); y += 30;

  ensure(40);
  doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(30, 30, 30);
  doc.text("Included in every estimate", L, y); y += 15;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  m.inclusions.forEach(function(x){
    var ls = doc.splitTextToSize(x, R - L - 14);
    ensure(ls.length * 13);
    doc.text("-", L, y); doc.text(ls, L + 12, y); y += ls.length * 13;
  });
  y += 10;

  if(m.notes){
    ensure(40);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.text("Notes", L, y); y += 15;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    var nl = doc.splitTextToSize(m.notes, R - L);
    for(var i=0;i<nl.length;i++){ ensure(13); doc.text(nl[i], L, y); y += 13; }
    y += 10;
  }

  ensure(30);
  doc.setFont("helvetica", "italic"); doc.setFontSize(9); doc.setTextColor(grey[0], grey[1], grey[2]);
  var foot = doc.splitTextToSize("This is an estimate. The final price is confirmed at your on-site design consultation.", R - L);
  doc.text(foot, L, y);
  return doc;
}

function loadJsPdf(cb){
  if(window.jspdf && window.jspdf.jsPDF) return cb(null, window.jspdf.jsPDF);
  var s = document.createElement("script");
  s.src = JSPDF_URL;
  s.onload = function(){ cb(window.jspdf && window.jspdf.jsPDF ? null : new Error("jsPDF did not load"), window.jspdf && window.jspdf.jsPDF); };
  s.onerror = function(){ cb(new Error("Could not load the PDF tool. Check the connection and try again.")); };
  document.head.appendChild(s);
}

function downloadPdf(){
  var msg = document.getElementById("pdf-msg"), btn = document.getElementById("pdf-btn");
  var who = document.getElementById("pdf-for");
  var say = function(t){ if(msg) msg.textContent = t; };
  if(btn) btn.disabled = true; say("Making your PDF...");
  loadJsPdf(function(err, JsPDF){
    if(btn) btn.disabled = false;
    if(err || !JsPDF){ say(err ? err.message : "Could not make the PDF."); return; }
    try{
      var m = pdfModel(who ? who.value.trim() : "");
      drawPdf(JsPDF, m).save(m.fileName);
      say("Saved " + m.fileName);
    }catch(e){ say("Could not make the PDF: " + (e && e.message ? e.message : e)); if(window.console) console.warn(e); }
  });
}

/* The Golden Eye portal asks for the PDF itself (to save it on a GHL contact). Only the page that frames us
   may ask, and only the portal copy, which is the one that has a parent to answer. */
window.addEventListener("message", function(e){
  if(!CONFIG.pdfExport || !CONFIG.postEstimateToParent || e.source !== window.parent) return;
  var d = e.data && e.data.makePdf;
  if(!d || typeof d.id !== "string") return;
  var reply = function(o){
    var r = { id:d.id };
    for(var k in o){ if(Object.prototype.hasOwnProperty.call(o, k)) r[k] = o[k]; }
    try{ window.parent.postMessage({ pdfResult:r }, "*"); }catch(x){}
  };
  loadJsPdf(function(err, JsPDF){
    if(err || !JsPDF){ reply({ error: err ? err.message : "Could not load the PDF tool." }); return; }
    try{
      var m = pdfModel(String(d.preparedFor || "").slice(0, 80));
      var uri = drawPdf(JsPDF, m).output("datauristring");
      var at = uri.indexOf("base64,");
      var t = Pricing.total(state.levels.slice(0, state.count), state.custom, state.promos);
      var tier = CONFIG.tiers[state.levels[0].tier];
      reply({ fileName:m.fileName, base64:uri.slice(at + 7), total:t.high, material: tier ? pdfText(tier.mfr + " " + tier.name) : "" });
    }catch(x){ reply({ error: "Could not make the PDF: " + (x && x.message ? x.message : x) }); }
  });
});

/* The small card under the notes. Only built where pdfExport is on. */
function mountPdfCard(){
  if(!CONFIG.pdfExport || document.getElementById("pdf-card")) return;
  var notes = document.getElementById("notes");
  if(!notes || !notes.parentNode || !notes.parentNode.parentNode) return;
  var card = document.createElement("div");
  card.className = "card"; card.id = "pdf-card";
  card.innerHTML =
    '<div class="cardhead">Save this estimate</div>' +
    '<div class="inline" style="margin-top:6px;">' +
      '<input type="text" id="pdf-for" placeholder="Prepared for (customer name, optional)" maxlength="80" style="flex:1;min-width:150px;" aria-label="Prepared for">' +
      '<button type="button" class="btn-add" id="pdf-btn" style="margin:0;" onclick="downloadPdf()">Download PDF</button>' +
    '</div>' +
    '<div class="fhint" id="pdf-msg" style="margin-top:6px;"></div>';
  notes.parentNode.parentNode.appendChild(card);
}

/* The same deck fields and line items the GHL payload carries, minus identity: the portal
   collects the customer itself. line_items goes as an array here, not the JSON string GHL's
   flat fields need. Only once unlocked, so a gated build that ever turned this on could not
   leak the price its gate is hiding. */
function notifyEstimate(){
  if(!CONFIG.postEstimateToParent || !state.unlocked) return;
  try{
    var p = buildPayload();
    var tt = Pricing.total(state.levels.slice(0, state.count), state.custom, state.promos);
    window.parent.postMessage({ deckEstimate:{
      line_items:  JSON.parse(p.line_items),
      total_sqft:  p.total_sqft,
      deck_levels: p.deck_levels,
      material:    p.material,
      rail_type:   p.rail_type,
      rail_lf:     p.rail_lf,
      steps:       p.steps,
      addons:      p.addons,
      price_low:   p.price_low,
      price_high:  p.price_high,
      notes:       p.notes,
      inclusions:  inclusionsFor(tt).join("; "),
      inclusions_list: inclusionsFor(tt),
      alternatives: materialAlternatives(tt).map(function(x){ return { label:x.label, name:x.name, low:x.low, high:x.high }; }),
      business_name: CONFIG.business.name,
      business_phone: CONFIG.business.phone
    }}, "*");
  }catch(e){ if(window.console) console.warn("deck estimate post failed:", e); }
}

/* ---------- boot ---------- */
/* "input", not "change": change only fires on blur, so a rep who types a note and goes straight
   to the portal's Create button would send the estimate without it. Notes don't re-render, so
   the framing page is told directly. */
mountPdfCard();
document.getElementById("notes").addEventListener("input", function(){
  state.notes = this.value;
  notifyEstimate();
});
document.getElementById("overlay").addEventListener("click", function(e){
  if(e.target === this) closeGate();
});
document.addEventListener("keydown", function(e){
  if(e.key === "Escape") closeGate();
});

/* A ?gate= override makes the two flows A/B testable without a redeploy. */
(function boot(){
  var override = new URLSearchParams(window.location.search).get("gate");
  if(override === "before" || override === "after" || override === "none") CONFIG.gateMode = override;

  if(CONFIG.gateMode === "none"){
    /* Open tool: unlocked from the start, no form, no blurred mock. Blocked
       is latched on because every webhook payload would carry a deck with no
       email to attach it to - orphaned rows in the CRM rather than leads. */
    state.unlocked = true;
    state.blocked  = true;
    render();
  }else if(CONFIG.gateMode === "before"){
    var mock = document.getElementById("mock");
    mock.classList.add("show");
    /* Modal mode pins the mock full-screen behind the overlay. Inline mode
       leaves it in the flow, under the form, as a preview of what unlocks. */
    if(!isInlineGate()) mock.classList.add("pinned");
    document.getElementById("app").style.display = "none";
    render();
    openGate();
  }else{
    render();
  }
})();
</script>
