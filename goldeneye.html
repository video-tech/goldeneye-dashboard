<div id="midas-master"
     data-supa-url="{{custom_values.supabase_url}}"
     data-supa-key="{{custom_values.supabase_api_key}}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

</div>

<script>
    // Boot screen: covers the page while body.html and app.js are fetched. Colors are written out
    // because the dashboard's own tokens do not exist yet. body.html carries the same screen and
    // app.js takes it down, so this one is removed the moment that one is in the page.
    (() => {
        const st = document.createElement('style');
        st.textContent = `
        #ge-boot { position: fixed; inset: 0; z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #16110c; transition: opacity .35s ease; }
        #ge-boot.done { opacity: 0; pointer-events: none; }
        #ge-boot.gone { display: none; }
        /* The logo is a transparent PNG, so it sits straight on the screen with a faint gold glow */
        #ge-boot .boot-mark { width: 96px; height: 96px; display: flex; align-items: center; justify-content: center; filter: drop-shadow(0 6px 28px rgba(217,180,99,.28)); }
        #ge-boot .boot-mark img { width: 96px; height: 96px; object-fit: contain; }
        #ge-boot .boot-name { font-family: Archivo, system-ui, sans-serif; font-size: 22px; font-weight: 600; letter-spacing: .02em; color: #f2ece0; }
        #ge-boot .boot-bar { width: min(240px, 60vw); height: 3px; border-radius: 2px; background: #241e16; overflow: hidden; }
        #ge-boot .boot-bar i { display: block; height: 100%; width: 0%; background: #d9b463; transition: width .5s ease; }
        #ge-boot .boot-bar.wait i { width: 35%; animation: boot-slide 1.1s ease-in-out infinite; }
        #ge-boot .boot-text { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #968c7a; min-height: 14px; }
        @keyframes boot-slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
        @media (prefers-reduced-motion: reduce) { #ge-boot .boot-bar.wait i { animation: none; width: 50%; } #ge-boot { transition: none; } }
        `;
        document.head.appendChild(st);
        const d = document.createElement('div');
        d.id = 'ge-boot';
        d.innerHTML = `<div class="boot-mark"><img src="https://assets.cdn.filesafe.space/HSLxIrFGc74MvO2Jqqzc/media/69b2f3daef8487e7a7c16d57.png" alt=""></div><div class="boot-name">Golden Eye</div><div class="boot-bar wait"><i></i></div><div class="boot-text">Starting</div>`;
        document.body.appendChild(d);
    })();

    (async () => {
        // Loaded via JS, not a static <link> tag: GHL's custom HTML block drops
        // static <link rel="stylesheet"> tags even though it executes <script> tags fine.
        const faLink = document.createElement('link');
        faLink.rel = 'stylesheet';
        faLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
        document.head.appendChild(faLink);

        // Home-screen install. GHL owns this page's <head>, so these go in from here —
        // Safari reads the live DOM at the moment someone taps "Add to Home Screen", so
        // injected tags count. Without them the icon is a screenshot and the app opens
        // inside Safari with the address bar still showing.
        const meta = (name, content) => {
            const m = document.createElement('meta');
            m.name = name; m.content = content;
            document.head.appendChild(m);
        };
        meta('apple-mobile-web-app-capable', 'yes');
        meta('mobile-web-app-capable', 'yes');
        meta('apple-mobile-web-app-title', 'Golden Eye');
        // Translucent lets the dashboard's own background run under the clock and
        // battery, which is why the wrapper pads for the safe area in standalone.
        meta('apple-mobile-web-app-status-bar-style', 'black-translucent');
        meta('theme-color', '#020617');

        const icon = document.createElement('link');
        icon.rel = 'apple-touch-icon';
        icon.href = 'https://assets.cdn.filesafe.space/HSLxIrFGc74MvO2Jqqzc/media/69b2f3daef8487e7a7c16d57.png';
        document.head.appendChild(icon);

        // Without viewport-fit=cover a translucent status bar leaves a blank band
        const vp = document.querySelector('meta[name="viewport"]');
        if (vp && !/viewport-fit/.test(vp.content)) vp.content += ', viewport-fit=cover';

        // navigator.standalone is the iOS signal; display-mode covers everyone else
        if (window.navigator.standalone === true ||
            window.matchMedia('(display-mode: standalone)').matches) {
            document.documentElement.classList.add('pwa-standalone');
        }

        const base = "https://video-tech.github.io/goldeneye-dashboard";

        // GitHub Pages serves these with Cache-Control: max-age=600, so without a
        // unique query param a fresh deploy can take ~10 minutes to appear and looks
        // like a failed push. This makes every page load fetch the current version.
        const bust = "?v=" + Date.now();

        const mount = document.getElementById('midas-master');
        try {
            const html = await fetch(base + "/body.html" + bust).then(r => r.text());
            mount.innerHTML = html;
            // The dashboard's own loading screen is in that markup now and looks the same
            document.getElementById('ge-boot')?.remove();
            const s = document.createElement('script');
            s.src = base + "/app.js" + bust;
            s.onerror = () => console.error("Goldeneye: failed to load app.js from " + s.src);
            document.body.appendChild(s);
        } catch (e) {
            console.error("Goldeneye: failed to load body.html from " + base, e);
            const boot = document.querySelector('#ge-boot .boot-text');
            if (boot) boot.textContent = 'Could not load. Reload the page.';        }
    })();
</script>
